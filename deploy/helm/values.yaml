# Default values for ..
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: bg3-tools
environment: production

image:
  repository: registry.jrbhome.net/bg3-tools
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SERVE_STATIC_FILES: "true"
env_secrets: []
# - name: env var name
#   secret: secret name
#   secretKey: key for secret data
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Whichever volume holds the SQLite files (the claim below, or Litestream's per-pod volume) is
# group-owned by the rails group, so the non-root app and Litestream can both write them.
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: ingress-internal
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
  hosts:
  - host: bg3-tools.prd.jrbhome.net
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - secretName: bg3-tools-production-tls
    hosts:
    - bg3-tools.prd.jrbhome.net

# The memory request is steady use (about 130 MiB, peaking at 170 MiB, 2026-11), so the scheduler
# and the cluster's failover-capacity alert see what the app really needs.
resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 192Mi

livenessProbe:
  httpGet:
    path: /up
    port: http
readinessProbe:
  httpGet:
    path: /up
    port: http

# SQLite on a claim pinned to one node (topolvm-xfs). Replaced by litestream below. The claim is
# kept (resource-policy: keep) when it leaves the chart, so rolling back is flipping the two flags
# again.
storage:
  enabled: false
  size: 2Gi
  storageClassName: topolvm-xfs

# SQLite on a per-pod volume instead of the claim above: restored from the app-storage bucket on
# start, and copied back to it continuously, by Litestream. The volume is created with the pod on
# whichever worker it lands and deleted with it, so the app isn't pinned to a node.
litestream:
  enabled: true
  image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
  # The app-storage Secret: endpoint, region, forcePathStyle, sqliteBucket and keys. Created by
  # `bin/ops app:storage:add bg3-tools --sqlite` in jrbhome-infra, so it defaults to s3-<appName>.
  secretName: ""
  # Databases copied to the bucket. The rest (cache, queue, cable) start empty on every boot and
  # the entrypoint's db:prepare rebuilds them: the app has no jobs, so the queue holds nothing.
  databases:
  - production.sqlite3
  volume:
    storageClassName: topolvm-ephemeral
    size: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

# Additional volumes/volumeMounts on the Deployment (beyond storage and litestream).
volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
