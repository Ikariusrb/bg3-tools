{{- if .Values.storage.enabled }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "..fullname" . }}-storage
  annotations:
    # Helm leaves the claim (and its data) in place when storage.enabled goes false, so the
    # Litestream cutover can be rolled back. Delete it by hand once Litestream is settled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  storageClassName: {{ .Values.storage.storageClassName }}
  volumeMode: Filesystem
{{- end }}
