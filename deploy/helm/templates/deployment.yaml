apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "..fullname" . }}
  labels:
    {{- include "..labels" . | nindent 4 }}
spec:
  # SQLite: a single writer only. Never scale beyond one replica, and recreate (don't roll) so
  # two pods never hold the databases at once: with Litestream, two pods would overwrite each
  # other's copies in the bucket.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "..selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.litestream.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.litestream.enabled }}
        # Roll the pod when the Litestream config changes.
        checksum/litestream: {{ include (print $.Template.BasePath "/litestream-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "..labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "..serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.litestream.enabled }}
      initContainers:
        # Rebuilds /rails/storage from the bucket before the app starts. A database with no copy
        # in the bucket yet is skipped, and db:prepare creates it.
        - name: litestream-restore
          image: {{ .Values.litestream.image }}
          command:
            - sh
            - -ec
            - |
              for db in {{ join " " .Values.litestream.databases }}; do
                litestream restore -config /etc/litestream/litestream.yml \
                  -if-db-not-exists -if-replica-exists -integrity-check quick "/rails/storage/$db"
              done
          env:
            {{- include "..litestreamEnv" . | trim | nindent 12 }}
          securityContext:
            {{- include "..litestreamSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.litestream.resources | nindent 12 }}
          volumeMounts:
            {{- include "..litestreamMounts" . | nindent 12 }}
        # Copies every change to the bucket. A native sidecar: it starts before the app and stops
        # after it, so a clean shutdown copies the last writes.
        - name: litestream
          image: {{ .Values.litestream.image }}
          restartPolicy: Always
          args: ["replicate", "-config", "/etc/litestream/litestream.yml"]
          env:
            {{- include "..litestreamEnv" . | trim | nindent 12 }}
          securityContext:
            {{- include "..litestreamSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.litestream.resources | nindent 12 }}
          volumeMounts:
            {{- include "..litestreamMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appName }}-master-key
                  key: RAILS_MASTER_KEY
            {{- range $secret := .Values.env_secrets }}
            - name: {{ $secret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.secret }}
                  key: {{ $secret.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.storage.enabled .Values.litestream.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.litestream.enabled }}
            - name: sqlite
              mountPath: /rails/storage
            {{- end }}
            {{- if .Values.storage.enabled }}
            - name: rails-storage
              mountPath: /rails/storage
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.storage.enabled .Values.litestream.enabled .Values.volumes }}
      volumes:
        {{- if .Values.litestream.enabled }}
        # Created with the pod on whichever worker it lands, deleted with it.
        - name: sqlite
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "..selectorLabels" . | nindent 18 }}
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: {{ .Values.litestream.volume.storageClassName }}
                resources:
                  requests:
                    storage: {{ .Values.litestream.volume.size }}
        - name: litestream-config
          configMap:
            name: {{ include "..fullname" . }}-litestream
        {{- end }}
        {{- if .Values.storage.enabled }}
        - name: rails-storage
          persistentVolumeClaim:
            claimName: {{ include "..fullname" . }}-storage
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
