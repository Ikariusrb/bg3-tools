{{- if .Values.litestream.enabled }}
{{- if .Values.storage.enabled }}
{{- fail "litestream.enabled and storage.enabled both claim /rails/storage: set storage.enabled false" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "..fullname" . }}-litestream
  labels:
    {{- include "..labels" . | nindent 4 }}
data:
  # One replica per database, each under its own file name in the bucket. ${...} is expanded by
  # Litestream from the containers' environment (see ..litestreamEnv).
  litestream.yml: |
    dbs:
    {{- range .Values.litestream.databases }}
      - path: /rails/storage/{{ . }}
        replica:
          type: s3
          bucket: ${S3_BUCKET}
          path: {{ . }}
          endpoint: ${S3_ENDPOINT}
          region: ${S3_REGION}
          force-path-style: ${S3_FORCE_PATH_STYLE}
    {{- end }}
{{- end }}
